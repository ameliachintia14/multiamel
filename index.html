<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amel fav song</title>
    <!-- Font Google untuk tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Gradasi Hijau Soft / Sage Green */
            background: linear-gradient(135deg, #eaf4ec 0%, #c2dfc8 50%, #9fc4a8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2d3748;
        }

        .card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(45, 85, 55, 0.1);
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1b4332;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #52796f;
            margin-bottom: 20px;
        }

        .music-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #2e7d32;
            margin-bottom: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .music-status:hover {
            transform: scale(1.03);
            background: #dbeddc;
        }

        .video-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            text-align: left;
        }

        .video-wrapper {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Audio Latar Belakang -->
    <audio id="bgAudio" loop preload="auto">
        <source src="nadin.mp3" type="audio/mpeg">
        Browser tidak mendukung audio.
    </audio>

    <div class="card">
        <!-- Pastikan nama file foto di folder sesuai dengan src ini (misal: foto.jpg / foto.png) -->
    <img src="profil.jpg" alt="Foto Amel" class="profile-img">

        <h1>Hi, I'm Amel! ✨</h1>
        <p class="subtitle">Welcome to my page & happy listening 😉</p>

        <!-- Tombol / Indikator Audio Latar -->
        <div class="music-status" id="musicBtn" onclick="toggleAudio()">
            <span>🎵</span> <span id="musicText">Klik di mana saja untuk memutar musik</span>
        </div>

        <div class="video-title">Ini adalah film aku, hehe 🎬</div>
        <div class="video-wrapper">
            <video controls>
                <source src="titik.mp4" type="video/mp4">
                Browser tidak mendukung video.
            </video>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgAudio');
        const musicText = document.getElementById('musicText');

        function startAudioOnFirstInteraction() {
            audio.play().then(() => {
                musicText.innerText = "Musik Latar Berputar (Klik untuk Pause)";
            }).catch(() => {});
            document.removeEventListener('click', startAudioOnFirstInteraction);
        }

        document.addEventListener('click', startAudioOnFirstInteraction);

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicText.innerText = "Musik Latar Berputar (Klik untuk Pause)";
            } else {
                audio.pause();
                musicText.innerText = "Musik Di-pause (Klik untuk Putar)";
            }
        }
    </script>
</body>
</html>
